name: Actualisation des actualités
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualites-quotidiennes
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les publications récentes
        run: python scripts/actualiser_actualites.py
      - name: Publier seulement en cas de changement
        run: |
          if git diff --quiet -- actualites.json; then
            echo "Aucun changement à publier"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites.json
          git commit -m "Actualiser la veille des finances publiques"
          git push
